name: Firmware

# Host tests, LVGL simulator self-test, ESP32-P4 firmware build for both chip-revision variants,
# OTA + full image packaging. Nothing is published or released here.
# A green run is NOT hardware proof (CLAUDE.md hard rule 8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Host tests (no ESP-IDF)
        run: bash tests/run_tests.sh

  simulator:
    # LVGL PC simulator: shell self-test at 1280x720 and 720x1280, web UI browser test, screenshots.
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build deps (SDL2 so the window mode is compiled too)
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build libsdl2-dev zlib1g-dev libjpeg-turbo8-dev
      - name: Build simulator
        run: |
          cmake -S firmware/sim -B build/sim -G Ninja
          cmake --build build/sim
      - name: Shell self-test
        run: build/sim/summit_sim --selftest --out sim-out
      - name: Web UI browser test (page + API against the simulator)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/web/e2e.mjs build/sim/summit_sim sim-out/web
          node tests/web/e2e_recipes.mjs build/sim/summit_sim sim-out/web
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots-${{ github.sha }}
          path: sim-out/
          if-no-files-found: warn

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # rev3 = ESP32-P4 v3.x (default), rev1 = v1.x. Not interchangeable.
        variant: [rev3, rev1]
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.variant }} and merge full image (app in ota_0)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4   # >= 5.5.3 required for P4 v3.x
          target: esp32p4
          path: firmware
          command: bash ../tools/ci_build.sh ${{ matrix.variant }}

      - name: Validate and package ${{ matrix.variant }}
        run: python3 tools/package_firmware.py firmware/build dist ${{ matrix.variant }} "${GITHUB_SHA:0:12}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: summit-firmware-${{ matrix.variant }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
