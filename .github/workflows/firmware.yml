name: Firmware

# Host tests, ESP32-P4 firmware build, OTA + full image packaging.
# Packaging only: nothing is published or released from this workflow.
# A green run is NOT hardware proof (CLAUDE.md hard rule 8).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Host tests (no ESP-IDF)
        run: bash tests/run_tests.sh

  firmware:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build for ESP32-P4 and merge full image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: firmware
          command: idf.py build && idf.py merge-bin -o summit-full.bin -f raw

      - name: Validate and package OTA + full images
        run: python3 tools/package_firmware.py firmware/build dist "${GITHUB_SHA:0:12}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: summit-firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
