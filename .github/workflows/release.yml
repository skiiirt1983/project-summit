name: Release (alpha)

# Builds both chip-revision variants at the given version and publishes the OTA images and the update
# catalog to GitHub Pages (the gh-pages branch of this public repository). Devices on the alpha channel
# read https://<owner>.github.io/<repo>/catalog.json and install from firmware/<version>/.
# Releases are immutable (CLAUDE.md hard rule 7): a version that is already published is refused, never replaced.
# One-time set-up: Settings > Pages > Source: "Deploy from a branch", branch gh-pages, folder / (root).
# A green run is NOT hardware proof (hard rule 8): flash and test before telling anyone to update.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version, e.g. 0.1.0-alpha.1 (never reuse one)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        variant: [rev3, rev1]
    steps:
      - uses: actions/checkout@v5

      - name: Check the version
        run: |
          v='${{ inputs.version }}'
          if ! python3 -c "import re,sys; sys.exit(0 if re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?', sys.argv[1]) and len(sys.argv[1]) <= 31 else 1)" "$v"; then
            echo "not a valid version (SemVer, at most 31 characters, no build metadata): $v"; exit 1
          fi
          sed -i "s/^set(PROJECT_VER \".*\")/set(PROJECT_VER \"$v\")/" firmware/CMakeLists.txt
          grep -n '^set(PROJECT_VER' firmware/CMakeLists.txt

      - name: Build ${{ matrix.variant }} and merge full image (app in ota_0)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32p4
          path: firmware
          command: bash ../tools/ci_build.sh ${{ matrix.variant }}

      - name: Validate and package ${{ matrix.variant }}
        run: python3 tools/package_firmware.py firmware/build dist ${{ matrix.variant }} "${GITHUB_SHA:0:12}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Publish to gh-pages
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            mkdir site && git -C site init -q -b gh-pages && git -C site remote add origin "$remote"
          fi
          for variant in rev3 rev1; do
            dest="site/firmware/$VERSION"
            if [ -e "$dest/build-info-$variant.json" ]; then
              echo "$VERSION ($variant) is already published: releases are immutable"; exit 1
            fi
            mkdir -p "$dest"
            cp "dl/release-$variant/summit-$VERSION-$variant-ota.bin" "$dest/"
            python3 - "$variant" "$VERSION" <<'PY'
          import json, sys, datetime
          variant, version = sys.argv[1:3]
          p = f"dl/release-{variant}/build-info.json"
          info = json.load(open(p))
          info["released"] = datetime.date.today().isoformat()
          json.dump(info, open(f"site/firmware/{version}/build-info-{variant}.json", "w"), indent=2)
          PY
          done
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python3 tools/catalog.py build site --base-url "$base" --channel alpha
          python3 tools/catalog.py validate site/catalog.json
          touch site/.nojekyll
          cd site
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Release $VERSION"
          git push origin gh-pages
          echo "Published $VERSION. Catalog: $base/catalog.json"
